spring.application.name=employee-network

# CognoDB Connection — values come from environment variables, not hardcoded.
# See README for how to set these.
spring.neo4j.uri=${COGNODB_URI}
spring.neo4j.authentication.username=${COGNODB_USERNAME}
spring.neo4j.authentication.password=${COGNODB_PASSWORD}

spring.neo4j.pool.idle-time-before-connection-test=30s
spring.neo4j.pool.max-connection-lifetime=5m

# Server
server.port=8080